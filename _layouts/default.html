<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

{% seo %}

    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

/**
 * Site header
 */
.site-header {
  position: relative;
  width: 100%;
  height: 55px;
  line-height: 1.5 * 16 * 2.25;
  background-color: #ffffff;
  border-top: 5px solid #818181;
  border-bottom: 1px solid #818181;
}
.site-header .wrapper {
    max-width: 900px;
    margin-right: auto;
    margin-left: auto;
    padding-right: 30px;
    padding-left: 30px;
    height: 40px
}
.site-header .wrapper .site-title 
 {
    font-size: 26px;
    font-weight: 300;
    line-height: 47px;
    letter-spacing: -1px;
    margin-bottom: 0;
    float: left;
    color: black;
    font-size: 23px
}

.site-nav {
    float: right;
    line-height: 48px;
    width:300px
}
</style>
  </head>

    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="site-header">

      <div class="wrapper">

          <nav class="site-nav">
            <label for="nav-trigger">
                         Chenxi Cai & Qiwen Huang & Xinya Lu
            </label>

    </header> 

    <main id="content" class="main-content" role="main">
      {{ content }}

  
    </main>
